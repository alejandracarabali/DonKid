name: Tests

# Cuándo se ejecuta: al subir código o abrir un Pull Request
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    # Máquina virtual limpia que GitHub presta durante la prueba
    runs-on: ubuntu-latest

    steps:
      # Descarga tu código en la máquina
      - uses: actions/checkout@v4

      # Instala PHP (misma versión que usas tú)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3

      # Instala Node para compilar Tailwind/Vite
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # La máquina no tiene .env: lo creamos desde la plantilla
      - name: Preparar entorno
        run: cp .env.example .env

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist

      - name: Generar clave de la app
        run: php artisan key:generate

      - name: Instalar y compilar el frontend
        run: |
          npm ci
          npm run build

      # Ejecuta tus tests
      - name: Ejecutar tests
        run: php artisan test